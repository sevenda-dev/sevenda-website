<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Sevenda — logo LinkedIn 300×300</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 300px; height: 300px; overflow: hidden; background: #0d0d0d; }
  /* logo nei 2/3 centrali: resta intero anche con il ritaglio circolare di LinkedIn */
  .wrap { width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
  img { display: block; width: 200px; height: auto; }
</style></head>
<body><div class="wrap"><img src="../logo.svg" alt="Sevenda"></div></body></html>
